server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at FILE_MAX_SIZE (10 MB) by the backend; nginx defaults
    # to 1 MB and would reject larger files with a 413 before they get there.
    client_max_body_size 20m;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Answers arrive as Server-Sent Events. Without disabling buffering,
        # nginx holds the whole response and the answer lands in one lump
        # instead of streaming token by token.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
